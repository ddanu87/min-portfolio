<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Royal Click Fighter wireframe</title>
  <desc id="desc">Papirprototype-inspireret wireframe af Royal Click Fighter med point, tid, liv og klikbare objekter.</desc>
  <rect width="1200" height="760" fill="#eef2f4"/>
  <rect x="140" y="70" width="920" height="620" rx="10" fill="#f7f7f4" stroke="#2f3740" stroke-width="7"/>
  <line x1="160" y1="150" x2="1040" y2="150" stroke="#c8ced3" stroke-width="4"/>
  <text x="230" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="#30343a">POINT</text>
  <text x="250" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="700" fill="#30343a">0</text>
  <text x="560" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="#30343a">TID</text>
  <rect x="470" y="170" width="210" height="62" rx="6" fill="#c8ced3" stroke="#30343a" stroke-width="5"/>
  <line x1="520" y1="175" x2="500" y2="225" stroke="#30343a" stroke-width="4"/>
  <line x1="565" y1="175" x2="545" y2="225" stroke="#30343a" stroke-width="4"/>
  <line x1="610" y1="175" x2="590" y2="225" stroke="#30343a" stroke-width="4"/>
  <text x="900" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="#30343a">LIV</text>
  <text x="920" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="700" fill="#30343a">3</text>
  <g stroke="#30343a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="300" y1="270" x2="300" y2="390"/><line x1="290" y1="285" x2="310" y2="285"/><line x1="285" y1="345" x2="315" y2="345"/>
    <line x1="520" y1="285" x2="520" y2="405"/><line x1="500" y1="300" x2="540" y2="300"/><line x1="510" y1="370" x2="535" y2="395"/>
    <line x1="780" y1="270" x2="780" y2="395"/><line x1="760" y1="310" x2="800" y2="310"/><line x1="765" y1="365" x2="805" y2="365"/>
  </g>
  <circle cx="315" cy="430" r="48" fill="#ffffff" stroke="#30343a" stroke-width="7"/>
  <text x="315" y="448" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="900" fill="#30343a">$</text>
  <polygon points="520,410 548,480 625,485 565,530 585,604 520,562 455,604 475,530 415,485 492,480" fill="#ffffff" stroke="#30343a" stroke-width="7"/>
  <rect x="720" y="410" width="105" height="105" rx="12" fill="#ffffff" stroke="#30343a" stroke-width="7" transform="rotate(10 772 462)"/>
  <circle cx="752" cy="442" r="8" fill="#30343a"/><circle cx="792" cy="482" r="8" fill="#30343a"/><circle cx="780" cy="438" r="8" fill="#30343a"/>
  <circle cx="920" cy="450" r="44" fill="#ffffff" stroke="#30343a" stroke-width="7"/>
  <path d="M900 410 C905 380 940 382 948 408" stroke="#30343a" stroke-width="7" fill="none"/>
  <line x1="180" y1="650" x2="1030" y2="650" stroke="#c8ced3" stroke-width="4"/>
  <text x="600" y="715" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#39424c">Papirprototype: point, timer, liv og gode/dårlige elementer</text>
