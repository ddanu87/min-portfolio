<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Royal Click Fighter</title>
  <desc id="desc">Illustration af et klikbaseret browser-spil med neon, point og interaktion.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#181124"/><stop offset="1" stop-color="#263238"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="150" y="110" width="900" height="540" rx="30" fill="#101820" stroke="#28d7e6" stroke-width="6"/>
  <text x="600" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" filter="url(#glow)">Royal Click Fighter</text>
  <rect x="430" y="292" width="340" height="88" rx="12" fill="#28d7e6"/>
  <text x="600" y="348" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="900" fill="#101820">START SPIL</text>
  <circle cx="300" cy="480" r="56" fill="#f7fbff"/><text x="300" y="493" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="900" fill="#7a3b69">+</text>
  <circle cx="600" cy="505" r="68" fill="#7a3b69"/><text x="600" y="522" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff">10</text>
  <circle cx="900" cy="480" r="56" fill="#f7fbff"/><text x="900" y="493" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="900" fill="#345c72">-</text>
  <text x="600" y="620" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#dde5ea">JavaScript · animation · spilflow</text>
</svg>
