<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Wallet — OBBG</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body data-page="wallet">
  <header data-header></header>
  <main class="container page">
    <section class="grid grid-2">
      <article class="card wallet-card">
        <span class="eyebrow">Demo wallet</span>
        <h1 data-balance>0 coins</h1>
        <p class="lead">Your balance is made of demo coins only. Demo coins have no real-world value and cannot be withdrawn.</p>
        <div class="actions">
          <button class="btn" type="button" onclick="addDemoCoins(500)">Add demo coins</button>
          <button class="btn secondary" type="button" onclick="resetWallet()">Reset wallet</button>
        </div>
      </article>
      <article class="card">
        <h2>Wallet rules</h2>
        <div class="match-summary">
          <div class="match-row"><span>Deposits</span><strong>No</strong></div>
          <div class="match-row"><span>Withdrawals</span><strong>No</strong></div>
          <div class="match-row"><span>Cash value</span><strong>None</strong></div>
          <div class="match-row"><span>Purpose</span><strong>Prototype flow</strong></div>
        </div>
      </article>
    </section>

    <section class="section">
      <h2>Transaction history</h2>
      <div class="history-list" data-transactions></div>
    </section>
  </main>
  <footer data-footer></footer>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/games.js"></script>
  <script src="../assets/js/wallet.js"></script>
  <script src="../assets/js/leaderboard.js"></script>
  <script src="../assets/js/matchmaking.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
